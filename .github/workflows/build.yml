# 拉上游 Teleport 源码 → 打补丁 → 为非 glibc 平台编译 → 发 Release。
#
# 本仓库不存放上游源码, 每次运行时按 tag 现拉。
#
# 产物矩阵 = {teleport(agent), tsh(客户端)} x {linux-amd64-static,
# linux-arm64-static, android-arm64}, 每个组合一个 tar.gz。分两类:
#   linux-amd64-static / linux-arm64-static  静态 musl, 不依赖目标系统 libc
#   android-arm64                            动态链接 Bionic (Termux)
#
# 一个工具一个包, 不合并: teleport 约 450MB, 只想要客户端的人不该被迫下它。
# tsh 的 cgo 依赖面是 teleport 的**真子集**(runtime/cgo, net, session/shell,
# plugin), 不碰任何被补丁改过的包 —— 所以它能编过是 teleport 能编过的推论。
# tctl 没有构建: 它是管理端工具, 放在非 glibc 的路由器/手机上没有实际用途。
# 后者刻意不是静态的 —— 原因见 build_termux job 顶部的注释, 一句话是
# Android 既没有 /etc/passwd 也没有 /etc/resolv.conf, 必须靠 Bionic 兜底。
#
# ── 为什么官方二进制在 OpenWrt / Termux 上跑不了 ──
# 官方 Linux 包是 CGO 动态链接 glibc 的(ldd 可见 libc.so.6 / libresolv.so.2 /
# libdl.so.2, interpreter /lib64/ld-linux-x86-64.so.2)。OpenWrt 只有 musl,
# Android 只有 Bionic, 都没有 glibc, 官方包直接起不来。
#
# ── 为什么不能简单地 CGO_ENABLED=0 ──
# 实测 v18.10.0 关掉 CGO 会打断 5 个包: lib/system(整包被 build 约束排除,
# signal.go 是该目录唯一的非 Windows 文件且是 cgo)、lib/inventory/metadata、
# session/uacc(还牵扯 mattn/go-sqlite3 非 cgo 桩缺 sqlite3.ErrReadonly)、
# session/shell、lib/secretsscanner/authorizedkeys。
#
# ── 所以: 保留 CGO=1 换 musl-gcc, 只改一个包 ──
# 上面 5 个包里除 metadata 外用的是 <signal.h>/<utmp.h>/<pwd.h>, musl 全都提供,
# 一行不用改就编过。详见 scripts/apply-nonglibc-patch.sh。
#
# ── 架构 ──
# 两个 **静态** 目标都在各自的原生 runner 上用原生 musl-gcc 编译, 不做交叉编译、
# 不需要 zig。arm64 用 GitHub 的免费 arm64 runner(仅 public 仓库)。
# Termux 目标是例外: NDK 的预构建工具链只有 linux-x86_64 一份, 只能在 x86_64
# runner 上交叉编译到 android/arm64。

name: build

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: '上游 tag (留空 = 自动取最新正式版, 忽略 rc/alpha)'
        required: false
        default: ''
      publish:
        description: '编译成功后发 Release'
        type: boolean
        default: true
      force:
        description: '同名 Release 已存在时覆盖重发'
        type: boolean
        default: false
      include_termux:
        description: '同时构建 Termux(Android/Bionic) 目标'
        type: boolean
        default: true
      include_tsh:
        description: '同时构建客户端 tsh(每个目标各一份)'
        type: boolean
        default: true

  # 想每周自动跟进上游就取消下面两行的注释。
  # 默认关着: 定时任务会在无人看管时对外发布 Release, 那应该是一个明确的选择,
  # 而不是装上就默认打开的东西。
  # schedule:
  #   - cron: '17 4 * * 1'

permissions:
  contents: write   # 发 Release 需要

env:
  UPSTREAM: https://github.com/gravitational/teleport.git

jobs:
  # ───────────────────────────────────────────────────────────
  # 决定要构建哪个版本, 并判断是否已经发过
  # ───────────────────────────────────────────────────────────
  resolve:
    runs-on: ubuntu-latest
    outputs:
      ref:     ${{ steps.pick.outputs.ref }}
      version: ${{ steps.pick.outputs.version }}
      skip:    ${{ steps.pick.outputs.skip }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.upstream_ref }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          if [ -n "$WANT" ]; then
            REF="$WANT"
            echo "使用指定的 ref: $REF"
          else
            # 只认 vX.Y.Z, 排除 rc/alpha/beta 之类
            REF=$(git ls-remote --tags --refs "$UPSTREAM" 'v*' \
                  | awk '{print $2}' | sed 's#refs/tags/##' \
                  | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                  | sort -V | tail -1)
            [ -n "$REF" ] || { echo "::error::没能从上游解析出任何正式版 tag"; exit 1; }
            echo "自动选中上游最新正式版: $REF"
          fi

          # 确认这个 ref 在上游真实存在, 免得后面 clone 到一半才失败
          git ls-remote --exit-code --tags "$UPSTREAM" "refs/tags/$REF" >/dev/null \
            || { echo "::error::上游没有 tag $REF"; exit 1; }

          echo "ref=$REF"          >> "$GITHUB_OUTPUT"
          echo "version=${REF#v}"  >> "$GITHUB_OUTPUT"

          # 已发过就跳过, 除非 force
          if gh release view "$REF" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$FORCE" = "true" ]; then
              echo "::warning::Release $REF 已存在, force=true, 将覆盖重发"
              echo "skip=false" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::Release $REF 已存在, 跳过。要重建请用 force=true。"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # ───────────────────────────────────────────────────────────
  # 各架构在自己的原生 runner 上编译
  # ───────────────────────────────────────────────────────────
  build:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    strategy:
      fail-fast: false     # 一个架构挂了也要看到另一个的结果
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      REF: ${{ needs.resolve.outputs.ref }}
      VERSION: ${{ needs.resolve.outputs.version }}
      ARCH: ${{ matrix.arch }}
      # 定时触发时 inputs 是空的 —— 直接写 `inputs.include_tsh` 会永远为假,
      # 和 release 那边记着的坑是同一个。
      TOOLS: ${{ (github.event_name != 'workflow_dispatch' || inputs.include_tsh) && 'teleport tsh' || 'teleport' }}
    steps:
      - name: 检出本仓库(补丁与脚本)
        uses: actions/checkout@v4

      - name: 确认 runner 架构与目标一致
        run: |
          set -euo pipefail
          want="$ARCH"; got="$(uname -m)"
          case "$got" in
            x86_64)  have=amd64 ;;
            aarch64) have=arm64 ;;
            *)       echo "::error::未知的 runner 架构 $got"; exit 1 ;;
          esac
          [ "$have" = "$want" ] || {
            echo "::error::runner 是 $have 但目标是 $want —— 本 workflow 只做原生编译, 不交叉编译"
            exit 1
          }
          echo "runner=$got → $have (符合)"

      - name: 拉取上游源码
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$REF" "$UPSTREAM" src
          echo "commit = $(git -C src rev-parse HEAD)"
          echo "go.mod = $(grep -m1 '^go ' src/go.mod)"

      - name: 打非 glibc 补丁
        run: bash scripts/apply-nonglibc-patch.sh src musl

      - name: 安装 musl 工具链
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools
          musl-gcc --version | head -1

      - name: 安装 Go(版本取自上游 go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: 确认 build tag 选中了正确的文件变体
        working-directory: src
        env:
          CGO_ENABLED: '1'
          CC: musl-gcc
        run: |
          set -euo pipefail
          # 期望: metadata 包在 musl tag 下没有任何 cgo 文件
          go list -tags musl -f 'metadata => GoFiles={{.GoFiles}} CgoFiles={{.CgoFiles}}' ./lib/inventory/metadata
          # 期望: lib/system 仍是 cgo(signal.h, musl 有)
          go list -tags musl -f 'system   => GoFiles={{.GoFiles}} CgoFiles={{.CgoFiles}}' ./lib/system
          if go list -tags musl -f '{{.CgoFiles}}' ./lib/inventory/metadata | grep -q glibc; then
            echo "::error::musl tag 没生效, 仍在编 glibc 变体"; exit 1
          fi
          # android 目标的补丁给 session/host/user 和 session/shell 加了 !android
          # 约束。musl 目标**不该**受影响 —— 这两行是防回归, 确保静态构建仍走
          # 原来的 cgo 实现(musl 提供了 pwent 全家和 <pwd.h>, 一行都不用改)。
          if [ -d ./session/host/user ]; then
            go list -tags musl -f 'host/user => CgoFiles={{.CgoFiles}}' ./session/host/user
            go list -tags musl -f '{{.CgoFiles}}' ./session/host/user | grep -q user_linux_cgo.go || {
              echo "::error::musl 下没有选中 user_linux_cgo.go —— android 补丁误伤了静态构建"; exit 1; }
          fi
          go list -tags musl -f 'shell => CgoFiles={{.CgoFiles}}' ./session/shell
          go list -tags musl -f '{{.CgoFiles}}' ./session/shell | grep -q shell_unix.go || {
            echo "::error::musl 下没有选中 shell_unix.go —— android 补丁误伤了静态构建"; exit 1; }

      - name: 编译
        working-directory: src
        env:
          CGO_ENABLED: '1'
          CC: musl-gcc
        run: |
          set -euo pipefail
          # -X 的符号是 version.go 里的 `var Gitref string`(大写 G)。
          # 写错路径 Go 不报错、只是静默失效, 所以别凭印象改。
          echo "要编的工具: $TOOLS"
          for t in $TOOLS; do
            echo "::group::编译 $t"
            go build -v -trimpath -tags musl \
              -ldflags="-s -w -linkmode external -extldflags -static -X github.com/gravitational/teleport.Gitref=$REF" \
              -o "../$t" "./tool/$t"
            echo "::endgroup::"
          done

      - name: 验证产物真的是静态的
        run: |
          set -euo pipefail
          for t in $TOOLS; do
            echo "=== $t ==="
            file "$t"
            if readelf -d "$t" 2>/dev/null | grep -q NEEDED; then
              echo "::error::$t 仍有动态依赖, 在 OpenWrt/Termux 上会起不来"
              readelf -d "$t" | grep NEEDED
              exit 1
            fi
            echo "无 NEEDED 条目(符合预期)"
            # runner 与目标同架构, 直接跑一遍
            "./$t" version
            ls -l "$t"
          done

      - name: 打包
        run: |
          set -euo pipefail
          # 一个工具一个包: 只要客户端的人不该被迫下 450MB 的 agent
          mkdir -p dist
          for t in $TOOLS; do
            NAME="${t}-${VERSION}-linux-${ARCH}-static"
            mkdir -p "dist/$NAME"
            cp "$t" "dist/$NAME/"
            cp README.md "dist/$NAME/" 2>/dev/null || true
            tar -C dist -czf "dist/${NAME}.tar.gz" "$NAME"
            rm -rf "dist/$NAME"
            ( cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256" )
            # 未压缩二进制的校验和也留一份: 用户解包后可以直接核对
            sha256sum "$t" | awk -v n="$NAME" -v b="$t" '{print $1"  "n"/"b}' \
              >> "dist/${NAME}.tar.gz.sha256"
          done
          ls -la dist
          cat dist/*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # ───────────────────────────────────────────────────────────
  # Termux (Android) —— 与上面的静态构建是两种不同的东西
  #
  # ⚠️ 这个产物**不是静态的**, 是刻意的。Android 上必须链接 Bionic:
  #   1. Android 没有 /etc/passwd。静态 musl 的 getpwnam/getpwuid 只会读那个
  #      文件, 返回 NULL; 而 Bionic 会为 Android 的 uid **合成** passwd 条目。
  #      Teleport 的 ssh_service 要解析登录用户的 shell 和 home, 拿不到就没法开会话。
  #   2. Android 没有 /etc/resolv.conf。DNS 要经由 Bionic 的 resolver 走 netd,
  #      静态二进制根本无从解析域名。
  # 所以这里是 GOOS=android + NDK clang, 动态链接 /system/lib64 里的 Bionic。
  #
  # 注意 NDK 的预构建工具链只有 linux-x86_64 一份, 所以本 job 必须跑在 x86_64
  # runner 上交叉编译到 arm64 —— 不能像上面那样用原生 arm64 runner。
  # ───────────────────────────────────────────────────────────
  build_termux:
    needs: resolve
    if: >-
      needs.resolve.outputs.skip != 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.include_termux)
    runs-on: ubuntu-latest      # 必须 x86_64: NDK 工具链只有 linux-x86_64
    timeout-minutes: 90
    env:
      REF: ${{ needs.resolve.outputs.ref }}
      VERSION: ${{ needs.resolve.outputs.version }}
      ARCH: arm64
      TOOLS: ${{ (github.event_name != 'workflow_dispatch' || inputs.include_tsh) && 'teleport tsh' || 'teleport' }}
    steps:
      - name: 检出本仓库(补丁与脚本)
        uses: actions/checkout@v4

      - name: 拉取上游源码
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$REF" "$UPSTREAM" src
          echo "commit = $(git -C src rev-parse HEAD)"

      - name: 打非 glibc 补丁
        # android 目标比 musl 多改 2 个包: Bionic 没有 passwd 枚举 API
        # (setpwent/getpwent/endpwent), 也没有 utmp 写入函数(updwtmp/getutline)
        run: bash scripts/apply-nonglibc-patch.sh src android

      - name: 定位 Android NDK
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            echo "::error::runner 上找不到 Android NDK。相关环境变量:"
            env | grep -i -E 'ndk|android' || true
            exit 1
          fi
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [ ! -d "$TC" ]; then
            echo "::error::NDK 里没有 linux-x86_64 预构建工具链: $TC"
            ls "$NDK/toolchains/llvm/prebuilt" 2>/dev/null || true
            exit 1
          fi
          # 选 API level: 必须 >= 24。
          # ⚠️ 这不再只是"Termux 支持 Android 7+"的偏好, 而是硬需求:
          #    补丁生成的 session/host/user/user_android.go 用了
          #    getgrnam_r / getgrgid_r, Bionic 从 API 24 才导出它们
          #    (getpwnam_r / getpwuid_r 倒是一直有)。低于 24 会链接失败。
          avail="$(ls "$TC" | sed -n 's/^aarch64-linux-android\([0-9]\+\)-clang$/\1/p' | sort -n)"
          [ -n "$avail" ] || { echo "::error::NDK 里没有 aarch64-linux-android*-clang"; ls "$TC" | head -20; exit 1; }
          echo "可用 API level: $(echo $avail | tr '\n' ' ')"
          API="$(echo "$avail" | grep -x 24 || echo "$avail" | awk '$1 >= 24' | head -1)"
          if [ -z "$API" ]; then
            echo "::error::NDK 里没有 >= 24 的 API level, 但 getgrnam_r/getgrgid_r 需要 24+"
            echo "可用: $(echo $avail | tr '\n' ' ')"
            exit 1
          fi
          CC="$TC/aarch64-linux-android${API}-clang"
          echo "NDK      = $NDK"
          echo "API      = $API"
          echo "CC       = $CC"
          "$CC" --version | head -1
          echo "CC=$CC" >> "$GITHUB_ENV"
          echo "NDK_API=$API" >> "$GITHUB_ENV"

      - name: 安装 Go(版本取自上游 go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: 确认 android 下选中了正确的文件变体
        working-directory: src
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          # 刻意**不传** -tags musl: android 上 `|| android` 那半边约束就该自己生效。
          # 这一步同时是对该约束的实测。
          go list -f 'metadata => GoFiles={{.GoFiles}} CgoFiles={{.CgoFiles}}' ./lib/inventory/metadata
          if go list -f '{{.CgoFiles}}' ./lib/inventory/metadata | grep -q glibc; then
            echo "::error::android 下仍选中 glibc 变体 —— Bionic 没有 gnu/libc-version.h, 必然失败"
            exit 1
          fi

          # ── 下面这两条是为了防止一个已经踩过的坑复发 ──
          #
          # 曾经把整个 session/host/user 让给上游的 user_forward.go(转发给
          # os/user)。那会编译成功、CI 全绿, 然后在真机上 100% 失败:
          #   Failed to launch: user: Lookup not implemented on android
          # 因为 Go 标准库的 os/user 在 GOOS=android 下是硬编码的桩。
          #
          # 这是纯运行期故障, 上面那种"能不能编过"的检查抓不到,
          # 所以必须在这里显式断言选中的是哪个文件。
          if [ -d ./session/host/user ]; then
            go list -f 'host/user => GoFiles={{.GoFiles}} CgoFiles={{.CgoFiles}}' ./session/host/user
            if ! go list -f '{{.CgoFiles}}' ./session/host/user | grep -q user_android.go; then
              echo "::error::android 下没有选中 user_android.go —— 补丁没生效"
              exit 1
            fi
            if go list -f '{{.GoFiles}}' ./session/host/user | grep -q user_forward.go; then
              echo "::error::android 下选中了 user_forward.go —— 它转发给 os/user 的 android 桩, tsh ssh 必然失败"
              exit 1
            fi
          else
            echo "::warning::旧布局(无 session/host/user): SSH 会话在 android 上不可用, 见补丁脚本注释"
          fi

          # pw_shell 在 Bionic 上恒为 /bin/sh, Termux 里不存在 —— 必须走专用实现
          go list -f 'shell => GoFiles={{.GoFiles}} CgoFiles={{.CgoFiles}}' ./session/shell
          if ! go list -f '{{.GoFiles}}' ./session/shell | grep -q shell_android.go; then
            echo "::error::android 下没有选中 shell_android.go —— 会拿到 Bionic 合成的 /bin/sh"
            exit 1
          fi

      - name: 编译
        working-directory: src
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          # 不加 -extldflags -static: 见本 job 顶部注释, Android 上必须动态链接 Bionic
          echo "要编的工具: $TOOLS"
          for t in $TOOLS; do
            echo "::group::编译 $t"
            go build -v -trimpath \
              -ldflags="-s -w -X github.com/gravitational/teleport.Gitref=$REF" \
              -o "../$t" "./tool/$t"
            echo "::endgroup::"
          done

      - name: 验证产物是 Android 二进制
        run: |
          set -euo pipefail
          for t in $TOOLS; do
            echo "=== $t ==="
            file "$t"
            # 决定性判据: 解释器必须是 Android 的 linker64
            interp="$(readelf -l "$t" | sed -n 's/.*interpreter: \(.*\)\]/\1/p')"
            echo "interpreter = ${interp:-<none>}"
            case "$interp" in
              /system/bin/linker64) : ;;
              *) echo "::error::$t 的解释器是 '${interp:-<none>}', 期望 /system/bin/linker64"; exit 1 ;;
            esac
            echo "--- NEEDED ---"
            readelf -d "$t" | grep NEEDED || true
            # Bionic 的 libc 就叫 libc.so; 出现 libc.so.6 说明误链到了 glibc
            readelf -d "$t" | grep -q 'NEEDED.*\[libc\.so\]' \
              || { echo "::error::$t 没有链接 Bionic 的 libc.so"; exit 1; }
            if readelf -d "$t" | grep -qE '\[libc\.so\.6\]|\[ld-linux'; then
              echo "::error::$t 链到了 glibc, 这在 Android 上跑不了"; exit 1
            fi
            ls -l "$t"
          done
          echo "确认: Android arm64 动态可执行文件"
          # ⚠️ runner 是 Linux/x86_64, 跑不了这些二进制 ——
          #    与静态构建不同, 本 job **没有** 冒烟测试, 真机验证是必需的。
          echo "::notice::Android 二进制无法在 runner 上执行, 未做冒烟测试"

      - name: 打包
        run: |
          set -euo pipefail
          mkdir -p dist
          for t in $TOOLS; do
            NAME="${t}-${VERSION}-android-arm64"
            mkdir -p "dist/$NAME"
            cp "$t" "dist/$NAME/"
            cp contrib/termux/README.md "dist/$NAME/" 2>/dev/null || true
            tar -C dist -czf "dist/${NAME}.tar.gz" "$NAME"
            rm -rf "dist/$NAME"
            ( cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256" )
            sha256sum "$t" | awk -v n="$NAME" -v b="$t" '{print $1"  "n"/"b}' \
              >> "dist/${NAME}.tar.gz.sha256"
          done
          ls -la dist
          cat dist/*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: dist-android-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # ───────────────────────────────────────────────────────────
  # 所有目标都成功才发 Release(缺目标的 Release 比没有更坑人)
  # ───────────────────────────────────────────────────────────
  release:
    needs: [resolve, build, build_termux]
    # 两个容易踩的坑, 都记在这里:
    #  1. 定时触发时 inputs 是空的, 写成 `&& inputs.publish` 会永远为假 ——
    #     那会让启用 schedule 的人得到"构建成功但永远不发版"的哑故障。
    #  2. **被跳过的依赖会连带跳过下游**。include_termux=false 时 build_termux
    #     是 skipped, 若不加 !cancelled() + 显式判定 result, release 也会被跳过,
    #     那个开关就等于没有。
    if: >-
      !cancelled() &&
      needs.resolve.outputs.skip != 'true' &&
      needs.build.result == 'success' &&
      (needs.build_termux.result == 'success' || needs.build_termux.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REF: ${{ needs.resolve.outputs.ref }}
      VERSION: ${{ needs.resolve.outputs.version }}
      FORCE: ${{ inputs.force }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
          merge-multiple: true

      - name: 汇总
        run: |
          set -euo pipefail
          ls -la dl
          cat dl/*.sha256 > SHA256SUMS
          echo "=== SHA256SUMS ==="; cat SHA256SUMS

      - name: 写 Release 说明
        run: |
          set -euo pipefail
          # 用 quoted heredoc + 占位符: 正文里有大量反引号和 $, 让 shell 去展开
          # 只会自找麻烦(反引号会变成命令替换)。
          cat > notes.md <<'EOF'
          上游 [`@REF@`](https://github.com/gravitational/teleport/releases/tag/@REF@) 的构建，
          用于官方包跑不了的平台（OpenWrt/musl、Termux/Bionic）。

          含 `teleport`（agent）与 `tsh`（客户端），**分开打包**——
          只想要客户端的人不必下 450MB 的 agent。不含 `tctl`（管理端工具，
          放在路由器/手机上没有实际用途）。

          ## 产物

          | 文件 | 内容 | 链接方式 | 平台 |
          |---|---|---|---|
          | `teleport-@VERSION@-linux-amd64-static.tar.gz` | agent | 静态 musl | x86_64 OpenWrt / 软路由 |
          | `teleport-@VERSION@-linux-arm64-static.tar.gz` | agent | 静态 musl | arm64 OpenWrt / 树莓派 / proot-distro |
          | `teleport-@VERSION@-android-arm64.tar.gz` | agent | **动态 Bionic** | Termux（原生） |
          | `tsh-@VERSION@-linux-amd64-static.tar.gz` | 客户端 | 静态 musl | 同上 |
          | `tsh-@VERSION@-linux-arm64-static.tar.gz` | 客户端 | 静态 musl | 同上 |
          | `tsh-@VERSION@-android-arm64.tar.gz` | 客户端 | **动态 Bionic** | Termux（原生） |

          两个 `-static` 的 `readelf -d` 无任何 `NEEDED` 条目。
          `android-arm64` **应该**有 `NEEDED [libc.so]` —— 那是 Bionic，不是构建失误：
          Android 既没有 `/etc/passwd`（用户解析）也没有 `/etc/resolv.conf`（DNS），
          必须靠 Bionic 兜底。

          ⚠️ **Termux 产物未在真机验证过。** CI 只能检查它是不是合法的 Android 二进制
          （解释器 `/system/bin/linker64`、链接 Bionic），**跑不了冒烟测试**。
          详见包内的 `README.md`。

          Termux 上装客户端最省事的办法（`termux-agent.sh` 见仓库 `contrib/termux/`）：

          ```
          bash ~/termux-agent.sh client
          ```

          ## 与官方包的差别

          - `lib/inventory/metadata` 的 glibc 版本探测在 musl / Bionic 下返回空串
            （两者都不导出运行时版本查询接口），其余源码与上游一致
          - 静态版体积与官方包基本相同（静态链接只多约 1.3MB）

          ## 校验

          ```
          sha256sum -c SHA256SUMS
          ```

          ## 安装

          见仓库 README 与 `contrib/`。

          ---
          由 `.github/workflows/build.yml` 自动构建。
          上游版权与许可归 Gravitational, Inc.（AGPL-3.0）。
          EOF
          sed -i "s#@REF@#${REF}#g; s#@VERSION@#${VERSION}#g" notes.md
          cat notes.md

      - name: 发布
        run: |
          set -euo pipefail
          if [ "$FORCE" = "true" ] && gh release view "$REF" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "删除已存在的 Release $REF (force)"
            gh release delete "$REF" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create "$REF" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Teleport $VERSION (static)" \
            --notes-file notes.md \
            dl/*.tar.gz SHA256SUMS
          gh release view "$REF" --repo "$GITHUB_REPOSITORY"
